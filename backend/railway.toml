[build]
builder = "nixpacks"

[deploy]
startCommand = "if [ ! -f \"${BOARDLIB_DB_PATH:-data/kilter.db}\" ]; then mkdir -p \"$(dirname \"${BOARDLIB_DB_PATH:-data/kilter.db}\")\" && python -m boardlib database kilter \"${BOARDLIB_DB_PATH:-data/kilter.db}\"; fi && python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[build.env]
PYTHONPATH = "/app/backend"
