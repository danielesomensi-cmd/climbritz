[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[build.env]
PYTHONPATH = "/app/backend"
